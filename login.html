<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillSwap | Login & Access Portal</title>
  <meta name="description" content="Sign in or register for SkillSwap - The peer-to-peer barter skill exchange platform with soft glassmorphic UI.">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page-body">

  <!-- Soft Pastel Mesh Background Blobs -->
  <div class="mesh-bg-container" aria-hidden="true">
    <div class="mesh-blob mesh-blob-1"></div>
    <div class="mesh-blob mesh-blob-2"></div>
    <div class="mesh-blob mesh-blob-3"></div>
    <div class="mesh-blob mesh-blob-4"></div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- Centered Glassmorphic Auth Card -->
  <main class="glass-elevated auth-card-container">
    
    <!-- Brand Header -->
    <header class="auth-brand-header">
      <div class="auth-brand-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 3h5v5"></path>
          <path d="M4 20L21 3"></path>
          <path d="M21 16v5h-5"></path>
          <path d="M15 15l6 6"></path>
          <path d="M4 4l5 5"></path>
        </svg>
      </div>
      <h2>SkillSwap</h2>
      <p id="authSubtitle">Learn & Teach Together • Peer Skill Exchange</p>
    </header>

    <!-- Role Toggle Switch at the top: User Login | Admin Login -->
    <div class="auth-role-switch" role="tablist" aria-label="Authentication Role">
      <button type="button" class="role-switch-btn active" id="btnRoleUser" role="tab" aria-selected="true" onclick="switchAuthRole('user')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        User Login
      </button>
      <button type="button" class="role-switch-btn" id="btnRoleAdmin" role="tab" aria-selected="false" onclick="switchAuthRole('admin')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        Admin Login
      </button>
    </div>

    <!-- USER AUTHENTICATION SECTION -->
    <section id="userAuthSection">
      <!-- Sub-tabs: Login vs Register -->
      <div class="auth-mode-subtabs" role="tablist">
        <button type="button" class="auth-mode-btn active" id="tabUserLogin" onclick="switchUserAuthMode('login')">Sign In</button>
        <button type="button" class="auth-mode-btn" id="tabUserRegister" onclick="switchUserAuthMode('register')">Create Account</button>
      </div>

      <!-- Prominent Continue with Google OAuth Button -->
      <button type="button" class="btn-google" id="googleOAuthBtn" onclick="handleGoogleOAuth()">
        <svg class="google-icon-svg" viewBox="0 0 24 24">
          <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/>
          <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
          <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15.2s.7 5.5 1.9 7.9l3.7-2.9c-.3-.8-.5-1.6-.5-2.4z"/>
          <path fill="#34A853" d="M12 23.5c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2-6.4-4.8L1.9 16.9C3.7 20.6 7.5 23.5 12 23.5z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <div class="auth-divider">or with email</div>

      <!-- USER LOGIN FORM -->
      <form id="userLoginForm" onsubmit="handleUserLogin(event)">
        <div class="form-group">
          <label class="form-label" for="userEmail">Email Address</label>
          <input type="email" id="userEmail" class="glass-input" placeholder="alex@example.com" required value="alex.rivera@example.com">
        </div>
        <div class="form-group">
          <label class="form-label" for="userPassword">Password</label>
          <input type="password" id="userPassword" class="glass-input" placeholder="••••••••" required value="password123">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; height: 48px; margin-top: 8px;">
          <span>Sign In to SkillSwap</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <!-- USER REGISTRATION FORM (Initially Hidden) -->
      <form id="userRegisterForm" style="display: none;" onsubmit="handleUserRegister(event)">
        <div class="form-group">
          <label class="form-label" for="regName">Full Name</label>
          <input type="text" id="regName" class="glass-input" placeholder="Elena Rostova" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="regEmail">Email Address</label>
          <input type="email" id="regEmail" class="glass-input" placeholder="elena@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="regPassword">Password</label>
          <input type="password" id="regPassword" class="glass-input" placeholder="Min. 8 characters" required minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label" for="regSkillsOffered">Top Skill You Can Teach</label>
          <input type="text" id="regSkillsOffered" class="glass-input" placeholder="e.g. Python, Graphic Design, Spanish">
        </div>
        <button type="submit" class="btn btn-emerald" style="width: 100%; height: 48px; margin-top: 8px;">
          <span>Create My Account</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </button>
      </form>
    </section>

    <!-- ADMIN AUTHENTICATION SECTION (Initially Hidden) -->
    <section id="adminAuthSection" style="display: none;">
      <div style="background: rgba(109, 59, 107, 0.08); border: 1px solid var(--primary-border); padding: 12px 16px; border-radius: var(--radius-md); margin-bottom: 20px;">
        <div style="display: flex; align-items: center; gap: 8px; color: var(--primary); font-weight: 700; font-size: 0.88rem; margin-bottom: 2px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          Platform Administrator Area
        </div>
        <p style="font-size: 0.78rem; color: var(--text-muted);">
          Restricted access for skill moderation, swap audit logs, and global platform announcements.
        </p>
      </div>

      <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
        <div class="form-group">
          <label class="form-label" for="adminEmail">Admin Security ID / Email</label>
          <input type="email" id="adminEmail" class="glass-input" placeholder="admin@skillswap.internal" required value="admin@skillswap.internal">
        </div>
        <div class="form-group">
          <label class="form-label" for="adminPassword">Security Key / Password</label>
          <input type="password" id="adminPassword" class="glass-input" placeholder="••••••••" required value="adminmasterkey">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; height: 48px; margin-top: 8px;">
          <span>Authorize Admin Access</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
        </button>
      </form>
    </section>

    <!-- Quick Demo Accounts Helper -->
    <div class="demo-accounts-box">
      <p>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
        Quick Fill Demo Accounts:
      </p>
      <div class="demo-chips-row">
        <button type="button" class="demo-chip" onclick="quickFillDemo('user')">Demo User (Alex)</button>
        <button type="button" class="demo-chip" onclick="quickFillDemo('admin')">Demo Admin</button>
      </div>
    </div>

  </main>

  <script>
    // Configuration & Backend Endpoints (Ready for Flask + MongoDB + Google OAuth)
    const API_ROUTES = {
      userLogin: '/api/auth/login',
      userRegister: '/api/auth/register',
      googleOAuth: '/auth/google',
      adminLogin: '/api/auth/admin-login'
    };

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          ${type === 'success' ? '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>' : 
            type === 'error' ? '<circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>' : 
            '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line>'}
        </svg>
        <span>${message}</span>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('toast-closing');
        setTimeout(() => toast.remove(), 250);
      }, 3500);
    }

    function switchAuthRole(role) {
      const btnUser = document.getElementById('btnRoleUser');
      const btnAdmin = document.getElementById('btnRoleAdmin');
      const userSection = document.getElementById('userAuthSection');
      const adminSection = document.getElementById('adminAuthSection');
      const subtitle = document.getElementById('authSubtitle');

      if (role === 'user') {
        btnUser.classList.add('active');
        btnUser.setAttribute('aria-selected', 'true');
        btnAdmin.classList.remove('active');
        btnAdmin.setAttribute('aria-selected', 'false');
        userSection.style.display = 'block';
        adminSection.style.display = 'none';
        subtitle.textContent = 'Learn & Teach Together • Peer Skill Exchange';
      } else {
        btnAdmin.classList.add('active');
        btnAdmin.setAttribute('aria-selected', 'true');
        btnUser.classList.remove('active');
        btnUser.setAttribute('aria-selected', 'false');
        userSection.style.display = 'none';
        adminSection.style.display = 'block';
        subtitle.textContent = 'Platform Moderation & Administrative Control';
      }
    }

    function switchUserAuthMode(mode) {
      const tabLogin = document.getElementById('tabUserLogin');
      const tabReg = document.getElementById('tabUserRegister');
      const formLogin = document.getElementById('userLoginForm');
      const formReg = document.getElementById('userRegisterForm');

      if (mode === 'login') {
        tabLogin.classList.add('active');
        tabReg.classList.remove('active');
        formLogin.style.display = 'block';
        formReg.style.display = 'none';
      } else {
        tabReg.classList.add('active');
        tabLogin.classList.remove('active');
        formLogin.style.display = 'none';
        formReg.style.display = 'block';
      }
    }

    // Google OAuth Handler ready for Flask Google OAuth route
    async function handleGoogleOAuth() {
      showToast('Connecting to Google OAuth backend (/auth/google)...', 'info');
      
      // Real backend redirection pattern:
      // window.location.href = API_ROUTES.googleOAuth;

      // Simulated seamless authentication for instant preview:
      setTimeout(() => {
        const googleUser = {
          id: 'usr_google_101',
          name: 'Alex Rivera (Google)',
          email: 'alex.rivera@gmail.com',
          role: 'user',
          avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80',
          location: 'San Francisco, CA',
          visibility: 'public',
          availability: ['Weekends', 'Weekday Evenings'],
          skillsOffered: ['Python Programming', 'Data Analysis', 'Flask APIs'],
          skillsWanted: ['Figma UI/UX', 'Digital Illustration'],
          rating: 4.9,
          swapsCompleted: 8
        };
        localStorage.setItem('skillswap_user', JSON.stringify(googleUser));
        localStorage.setItem('skillswap_role', 'user');
        showToast('Google OAuth Authentication successful! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 800);
      }, 600);
    }

    async function handleUserLogin(e) {
      e.preventDefault();
      const email = document.getElementById('userEmail').value.trim();
      const password = document.getElementById('userPassword').value;

      showToast('Authenticating user...', 'info');

      // Placeholder for Flask API fetch:
      /*
      try {
        const response = await fetch(API_ROUTES.userLogin, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await response.json();
      } catch (err) { ... }
      */

      setTimeout(() => {
        const user = {
          id: 'usr_alex_01',
          name: 'Alex Rivera',
          email: email,
          role: 'user',
          avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80',
          location: 'San Francisco, CA',
          visibility: 'public',
          availability: ['Weekends', 'Weekday Evenings'],
          skillsOffered: ['Python', 'Flask Web Dev', 'SQL & Mongo'],
          skillsWanted: ['Figma UI/UX', 'Pottery & Ceramics'],
          rating: 4.9,
          swapsCompleted: 8
        };
        localStorage.setItem('skillswap_user', JSON.stringify(user));
        localStorage.setItem('skillswap_role', 'user');
        showToast('Welcome back, Alex! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 600);
      }, 500);
    }

    async function handleUserRegister(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const skill = document.getElementById('regSkillsOffered').value.trim();

      showToast('Registering user account on MongoDB...', 'info');

      setTimeout(() => {
        const newUser = {
          id: 'usr_' + Date.now(),
          name: name,
          email: email,
          role: 'user',
          avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&auto=format&fit=crop&q=80',
          location: 'New York, NY',
          visibility: 'public',
          availability: ['Weekends'],
          skillsOffered: skill ? [skill] : ['Graphic Design'],
          skillsWanted: ['Python'],
          rating: 5.0,
          swapsCompleted: 0
        };
        localStorage.setItem('skillswap_user', JSON.stringify(newUser));
        localStorage.setItem('skillswap_role', 'user');
        showToast('Account created successfully! Loading dashboard...', 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 600);
      }, 600);
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      
      showToast('Verifying Administrator credentials...', 'info');

      setTimeout(() => {
        const adminUser = {
          id: 'adm_master_001',
          name: 'Sarah Connor (Admin)',
          email: email,
          role: 'admin',
          avatar: 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=150&auto=format&fit=crop&q=80'
        };
        localStorage.setItem('skillswap_user', JSON.stringify(adminUser));
        localStorage.setItem('skillswap_role', 'admin');
        showToast('Admin authorized! Opening Administrator Dashboard...', 'success');
        setTimeout(() => {
          window.location.href = 'index.html?view=admin';
        }, 600);
      }, 500);
    }

    function quickFillDemo(role) {
      if (role === 'user') {
        switchAuthRole('user');
        switchUserAuthMode('login');
        document.getElementById('userEmail').value = 'alex.rivera@example.com';
        document.getElementById('userPassword').value = 'password123';
        showToast('Filled Demo User credentials. Click "Sign In" or Enter.', 'info');
      } else {
        switchAuthRole('admin');
        document.getElementById('adminEmail').value = 'admin@skillswap.internal';
        document.getElementById('adminPassword').value = 'adminmasterkey';
        showToast('Filled Demo Admin credentials. Click "Authorize Admin Access".', 'info');
      }
    }
  </script>
</body>
</html>
